<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Mail · 正文渲染自检</title>
<style>
  body { margin: 0; padding: 12px; background: #111; color: #eee;
         font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  h2 { font-size: 13px; margin: 14px 0 4px; color: #7ee787; }
  p.hint { margin: 0 0 10px; color: #9aa1ab; font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; background: #000; padding: 10px;
        border-radius: 8px; font-size: 12px; line-height: 1.5; }
  iframe { width: 100%; height: 120px; border: 1px solid #444; background: #fff; display: block; }
</style>
</head>
<body>
<h1>Nova Mail · 正文渲染自检</h1>
<p class="hint">两个 iframe 里是同一封 HTML 邮件的文档：A 不带 CSP，B 带 Nova Mail 应用里那条 CSP。
如果 A 正常、B 空白，就是 CSP 在这台设备上把正文挡掉了。请把这个页面截图发回。</p>
<pre id="out">running…</pre>

<h2>A · 不带 CSP</h2>
<iframe id="frameA" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" scrolling="auto" referrerpolicy="no-referrer"></iframe>

<h2>B · 带应用的 CSP</h2>
<iframe id="frameB" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox" scrolling="auto" referrerpolicy="no-referrer"></iframe>

<script>
var MIN_WIDTH = 80

var STYLE = 'html,body{margin:0;padding:0;background:transparent}'
  + 'body{font:15px/1.6 sans-serif;color:#13181d;display:flow-root;word-break:break-word;overflow-wrap:anywhere}'
  + 'body > *{max-width:100%!important;box-sizing:border-box}'
  + '.nova-mail-body{display:flow-root}'
  + 'img{max-width:100%;height:auto}table{max-width:100%;border-collapse:collapse}'

// The exact CSP meta the app writes into the frame (utils/mail-frame.js).
var CSP = "default-src 'none'; img-src data: blob: https: http:; media-src data: blob:; "
  + "font-src data:; style-src 'unsafe-inline'; script-src 'none'; connect-src 'none'; "
  + "form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"

var BODY = '<div class="nova-mail-body" data-nova-mail-body="1">'
  + '<h1 style="color:#123456">Hello</h1>'
  + '<p>This is HTML mail that arrived without a proper Content-Type.</p>'
  + '<table width="600" style="border-collapse:collapse"><tr><td style="padding:8px;border:1px solid #ccc">cell one</td></tr>'
  + '<tr><td style="padding:8px;border:1px solid #ccc">cell two</td></tr></table>'
  + '<p><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGQAAAAyCAYAAACqNX6+AAAAOUlEQVR42u3PMQEAAAgDoC251a3gLwSgcyfF4QAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADwYwGkvQABlKbC6QAAAABJRU5ErkJggg==" width="80" height="40" alt="inline"></p>'
  + '<p>A block of text long enough to wrap over several lines on a phone screen, so the measured height is clearly not the viewport floor.</p>'
  + '</div>'

function doc(withCsp) {
  return '<!DOCTYPE html><html lang="und"><head><meta charset="utf-8">'
    + '<meta name="referrer" content="no-referrer">'
    + (withCsp ? '<meta http-equiv="Content-Security-Policy" content="' + CSP + '">' : '')
    + '<style>' + STYLE + '</style></head><body>' + BODY + '</body></html>'
}

function probe(iframe) {
  var lines = []
  lines.push('iframe box: ' + iframe.clientWidth + 'x' + iframe.clientHeight)

  var d = null
  try { d = iframe.contentDocument } catch (e) { lines.push('contentDocument: THREW ' + e.name); return { lines: lines, height: 0 } }
  if (!d) { lines.push('contentDocument: null'); return { lines: lines, height: 0 } }

  var body = d.body
  if (!body) { lines.push('body: missing'); return { lines: lines, height: 0 } }

  var wrap = d.querySelector('[data-nova-mail-body]')
  var h1 = d.querySelector('h1')
  var img = d.querySelector('img')
  var wrapRect = wrap ? wrap.getBoundingClientRect() : { width: 0, height: 0 }
  var height = Math.round(wrapRect.height || 0)

  lines.push('body.innerHTML: ' + body.innerHTML.length + ' chars')
  lines.push('body text: "' + (body.textContent || '').replace(/[ \n\r\t]+/g, ' ').trim().slice(0, 46) + '"')
  lines.push('wrap: ' + Math.round(wrapRect.width) + 'x' + height)
  if (h1) {
    var cs = getComputedStyle(h1)
    lines.push('h1: color=' + cs.color + ' opacity=' + cs.opacity + ' visibility=' + cs.visibility + ' display=' + cs.display
      + ' fontSize=' + cs.fontSize + ' rect=' + Math.round(h1.getBoundingClientRect().height))
  } else lines.push('h1: MISSING (sanitized away?)')
  lines.push('img: ' + (img ? (img.complete ? 'loaded ' : 'not loaded ') + img.naturalWidth + 'x' + img.naturalHeight : 'MISSING'))

  if (height > 8 && iframe.clientWidth >= MIN_WIDTH) {
    iframe.style.height = height + 'px'
    iframe.setAttribute('scrolling', 'no')
    lines.push('=> applied height ' + height + 'px')
  } else {
    lines.push('=> kept fallback height ' + iframe.clientHeight + 'px')
  }

  return { lines: lines, height: height }
}

function run() {
  var a = document.getElementById('frameA')
  var b = document.getElementById('frameB')
  var out = document.getElementById('out')

  a.srcdoc = doc(false)
  b.srcdoc = doc(true)

  var done = 0
  function report() {
    if (++done < 2) return
    setTimeout(function () {
      var ra = probe(a)
      var rb = probe(b)
      var lines = []
      lines.push('UA: ' + navigator.userAgent)
      lines.push('viewport: ' + innerWidth + 'x' + innerHeight + '  dpr=' + (devicePixelRatio || 1))
      lines.push('')
      lines.push('A · 不带 CSP')
      lines = lines.concat(ra.lines)
      lines.push('')
      lines.push('B · 带应用的 CSP')
      lines = lines.concat(rb.lines)
      lines.push('')
      lines.push('结论: ' + (ra.height > 8 && rb.height > 8
        ? '两版都能渲染 —— CSP 不是原因'
        : (ra.height > 8 ? 'A 正常 / B 失败 —— CSP 是原因！' : '两版都失败 —— 与 CSP 无关，是文档或设备本身')))
      out.textContent = lines.join('\n')
    }, 400)
  }

  a.addEventListener('load', report)
  b.addEventListener('load', report)
  setTimeout(function () { if (out.textContent === 'running…') out.textContent = 'timeout: load 未触发' }, 5000)
}

run()
</script>
</body>
</html>
