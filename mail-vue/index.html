<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#FFFFFF" id="theme-color-meta">
  <meta name="description" content="Nova Mail — your mail, your rules.">
  <meta name="application-name" content="Nova Mail">
  <meta name="apple-mobile-web-app-title" content="Nova Mail">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nova Mail</title>
  <link rel="icon" href="/src/icons/svg/brand-mark.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/nova-mail-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/nova-mail-192.png">
  <!-- Explicit rendering prevents the API script from racing Vue's lifecycle. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script>
    const uiStoreStr =  localStorage.getItem('ui')
    let isDark = false
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      isDark = uiStore.dark
      const root = document.documentElement
      root.setAttribute('class', isDark ? 'dark' : '');
    }
    const metaTag = document.getElementById('theme-color-meta');
    metaTag.setAttribute('content', isDark ? '#141414' : '#FFFFFF');
  </script>
</head>
<style>
  html {
    background: #FFFFFF;
  }
  .dark {
    background: #141414;
  }
  #loading-first {
    position: fixed;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
    background: var(--el-bg-color);
  }

  .loading-hide {
    pointer-events: none;
    opacity: 0;
  }

  .loading-icon {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }

  .loading-image {
    width: 70px;
    height: 70px;
    object-fit: contain;
  }

  .loading-progress {
    position: relative;
    width: 64px;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(64, 158, 255, 0.18);
  }

  .loading-progress::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: #409EFF;
    transform: scaleX(0);
    transform-origin: left center;
    animation: loading-progress-grow 2.4s linear forwards;
  }

  .loading-progress::after {
    content: "";
    position: absolute;
    top: 0;
    width: 24px;
    height: 100%;
    border-radius: inherit;
    background: rgba(64, 158, 255, 0.45);
    filter: blur(4px);
    transform: translateX(-24px);
    animation: loading-progress-peg 2.4s linear forwards;
  }

  .loading-complete .loading-progress::before {
    animation: none;
    transform: scaleX(1);
    transition: transform 200ms linear;
  }

  .loading-complete .loading-progress::after {
    animation: none;
    transform: translateX(60px);
    transition: transform 200ms linear;
  }

  @keyframes loading-progress-grow {
    0% {
      transform: scaleX(0);
    }
    100% {
      transform: scaleX(1);
    }
  }

  @keyframes loading-progress-peg {
    0% {
      transform: translateX(-24px);
    }
    100% {
      transform: translateX(60px);
    }
  }
</style>
<body>
<div id="loading-first" >
  <div class="loading-icon">
    <img class="loading-image" src="/icons/nova-mail-192.png" alt="Nova Mail">
    <div class="loading-progress" aria-hidden="true"></div>
  </div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
